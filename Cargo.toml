[workspace]
resolver = "3"
members = ["crates/kaanal-core"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
indexmap = { version = "2", features = ["serde"] }
humantime-serde = "1.1"
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync"] }
axum = "0.8"
matchit = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
clap = { version = "4", features = ["derive"] }
ureq = { version = "3", features = ["json"] }
reqwest = { version = "0.12", features = ["json"] }
jsonschema = "0.58"
kaanal-core = { path = "crates/kaanal-core" }
kaanal-data = { path = "crates/kaanal-data" }
kaanal-server = { path = "crates/kaanal-server" }
