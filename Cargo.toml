[workspace]
resolver = "3"
members = [
    "crates/kaanal-core",
    "crates/kaanal-data",
    "crates/kaanal-winhandle",
    "crates/kaanal-server",
    "crates/kaanal-sim",
    "crates/kaanal",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
indexmap = { version = "2", features = ["serde"] }
humantime = "2"
humantime-serde = "1.1"
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "time",
    "signal",
    "sync",
] }
axum = "0.8"
matchit = "0.8"
percent-encoding = "2"
tokio-stream = { version = "0.1", features = ["sync"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "=4.6.11"
ureq = { version = "3", default-features = false, features = ["json"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
jsonschema = { version = "0.58", default-features = false }
regex-syntax = "0.8"
schemars = { version = "1.2", features = ["indexmap2"] }
saphyr = { version = "0.1", default-features = false }
saphyr-parser = "0.1"
# Auth. rsa 0.9 signs with digest 0.10, so sha2 stays on 0.10; the sha2
# feature turns on sha2/oid, which pkcs1v15::SigningKey<Sha256> needs.
rsa = { version = "0.9.10", features = ["sha2"] }
sha2 = "0.10"
base64 = "0.22"
dirs = "6"
serde_urlencoded = "0.7"
url = "2"
# Dev-only independent verifier for our hand-rolled RS256 (pure Rust backend, same rsa/sha2).
jsonwebtoken = { version = "11.1", default-features = false, features = [
    "rust_crypto",
] }
kaanal-core = { path = "crates/kaanal-core" }
kaanal-data = { path = "crates/kaanal-data" }
kaanal-server = { path = "crates/kaanal-server" }
kaanal-sim = { path = "crates/kaanal-sim" }
kaanal-winhandle = { path = "crates/kaanal-winhandle" }

# Lint policy for every crate (each opts in with `[lints] workspace = true`).
# Enforced by the pre-commit hook: clippy runs with `-D warnings`.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Pedantic, with the lints that fight this codebase's idioms switched off.
# Add a lint here (with a comment why) instead of sprinkling `#[allow]` in code.
pedantic = { level = "warn", priority = -1 }
# Docs: `# Errors` sections are required on public Result fns (missing_docs is on
# per crate); `# Panics` would be noise for invariant `expect`s in handlers.
missing_panics_doc = "allow"
# These three flag deliberate style, not bugs:
must_use_candidate = "allow"
module_name_repetitions = "allow"
similar_names = "allow"

# A 2048-bit RSA keygen takes seconds with unoptimised bignum maths; tests generate keys.
[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3
