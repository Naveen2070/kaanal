[workspace]
resolver = "3"
members = [
    "crates/kaanal-core",
    "crates/kaanal-data",
    "crates/kaanal-winhandle",
    "crates/kaanal-server",
    "crates/kaanal-sim",
    "crates/kaanal",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
indexmap = { version = "2.14.2", features = ["serde"] }
humantime = "2.4.0"
humantime-serde = "1.1.1"
rand = "0.10.3"
rand_chacha = "0.10.0"
rand_distr = "0.6.0"
tokio = { version = "1.54.1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "time",
    "signal",
    "sync",
] }
axum = "0.8.9"
matchit = "0.8.4"
percent-encoding = "2.3.2"
tokio-stream = { version = "0.1.19", features = ["sync"] }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "=4.6.11"
ureq = { version = "3.5.1", default-features = false, features = ["json"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
jsonschema = { version = "0.61.2", default-features = false }
regex-syntax = "0.8.11"
schemars = { version = "1.2.3", features = ["indexmap2"] }
saphyr = { version = "0.3.4", default-features = false }
saphyr-parser = "0.3.4"
# Auth. rsa 0.10 signs with digest 0.11, so sha2 stays on 0.11 with it (move them together);
# rsa 0.10 needs the `pkcs1v15` feature for SigningKey<Sha256>, and getrandom 0.4 (the one rsa
# uses) gives the OS random source for key generation.
rsa = { version = "0.10.0", features = ["pkcs1v15"] }
sha2 = "0.11.1"
base64 = "0.23.1"
getrandom = { version = "0.4.3", features = ["sys_rng"] }
dirs = "7.0.0"
serde_urlencoded = "0.7.1"
url = "2.5.8"
# Dev-only independent verifier for our hand-rolled RS256 (pure Rust backend, same rsa/sha2).
jsonwebtoken = { version = "11.1.0", default-features = false, features = [
    "rust_crypto",
] }
kaanal-core = { path = "crates/kaanal-core" }
kaanal-data = { path = "crates/kaanal-data" }
kaanal-server = { path = "crates/kaanal-server" }
kaanal-sim = { path = "crates/kaanal-sim" }
kaanal-winhandle = { path = "crates/kaanal-winhandle" }

# Lint policy for every crate (each opts in with `[lints] workspace = true`).
# Enforced by the pre-commit hook: clippy runs with `-D warnings`.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Pedantic, with the lints that fight this codebase's idioms switched off.
# Add a lint here (with a comment why) instead of sprinkling `#[allow]` in code.
pedantic = { level = "warn", priority = -1 }
# Docs: `# Errors` sections are required on public Result fns (missing_docs is on
# per crate); `# Panics` would be noise for invariant `expect`s in handlers.
missing_panics_doc = "allow"
# These three flag deliberate style, not bugs:
must_use_candidate = "allow"
module_name_repetitions = "allow"
similar_names = "allow"

# A 2048-bit RSA keygen takes seconds with unoptimised bignum maths; tests generate keys.
[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3
