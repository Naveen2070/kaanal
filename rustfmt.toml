# Kaanal formatting: rustfmt defaults plus these. Applied by `cargo fmt --all`,
# enforced by the pre-commit hook. Stable options only.
# `cargo fmt` reads the edition from Cargo.toml; this line covers plain `rustfmt <file>`
# (editors, scripts), which would otherwise default to edition 2015.
edition = "2024"
use_field_init_shorthand = true
use_try_shorthand = true
