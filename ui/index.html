<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Kaanal Studio: draw a system, break it on purpose, and see what gives first."
    />
    <title>Kaanal Studio</title>
    <link rel="icon" type="image/svg+xml" href="/src/brand/favicon.svg" />
    <link rel="apple-touch-icon" href="/src/brand/apple-touch-icon.png" />
    <link
      rel="preload"
      href="/src/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- the critical placeholder until the bundle mounts: ground colour and the mark, nothing else
         (the CSP allows inline style, not inline script; boot.js has set data-theme already) -->
    <style>
      html {
        color-scheme: light dark;
        background: light-dark(#f3f6fa, #000000);
      }
      html[data-theme="light"] {
        color-scheme: light;
      }
      html[data-theme="dark"] {
        color-scheme: dark;
      }
      .kaanal-boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: light-dark(#1f6fe0, #5aa2ff);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="kaanal-boot" aria-hidden="true">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="currentColor">
          <clipPath id="kaanal-boot-sun"><path d="M3.2 13.5A8.8 8.8 0 0 1 20.8 13.5Z" /></clipPath>
          <g clip-path="url(#kaanal-boot-sun)">
            <rect x="2" y="3.9" width="20" height="3.7" />
            <rect x="2" y="8.5" width="20" height="2.4" />
            <rect x="2" y="12.4" width="20" height="1.1" />
          </g>
          <line
            x1="1"
            x2="23"
            y1="14.9"
            y2="14.9"
            stroke="currentColor"
            stroke-width="1.1"
            opacity="0.55"
          />
          <rect x="4.6" y="16.3" width="14.8" height="1.8" rx="0.9" opacity="0.7" />
          <rect x="7.4" y="19" width="11.2" height="1.6" rx="0.8" opacity="0.45" />
          <rect x="3.2" y="21.5" width="7.6" height="1.3" rx="0.65" opacity="0.26" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
