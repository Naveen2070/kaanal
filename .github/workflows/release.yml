name: Release

# Manual only. How to release:
#   1. Set the version in Cargo.toml ([workspace.package]) and write RELEASE.md: its first line is
#      `Tag: vX.Y.Z` (it must match the Cargo.toml version), the rest is the release notes.
#   2. Merge that to main.
#   3. Run this workflow on main with "publish" ticked. It builds Linux x86_64, macOS arm64 and Windows
#      x86_64 archives, then creates the tag at the built commit and a GitHub release with the archives and
#      SHA256SUMS. Versions below 1.0 are marked as pre-releases.
# Running it with "publish" off, or on another branch, only builds the archives (kept as artifacts for a
# week) and checks RELEASE.md; nothing is tagged or published.
#
# With "publish" ticked the run also publishes to crates.io and npm, by TRUSTED PUBLISHING: no token is
# stored in this repository; each registry accepts this workflow's short-lived GitHub identity (OIDC)
# instead. One-time setup (RULES 148):
#   - GitHub: create the environments `crates-io` and `npm` (Settings > Environments); add yourself as a
#     required reviewer if you want a pause before the registries are touched.
#   - crates.io: each of the six crates must already exist (the first version is published by hand with an
#     API token: crates.io has no "pending publisher"). Then, per crate, Settings > Trusted Publishing >
#     GitHub: owner Naveen2070, repository kaanal, workflow release.yml, environment crates-io.
#   - npm: the same for the packages `kaanal`, `@kaanal/linux-x64`, `@kaanal/darwin-arm64` and
#     `@kaanal/win32-x64` (the `@kaanal` org must exist): package Settings > Trusted Publisher > GitHub
#     Actions: owner Naveen2070, repository kaanal, workflow filename release.yml, environment npm. npm
#     does not check these on save; a mismatch shows only as an error at publish time.
# A registry job that fails can be re-run from the Actions page (the artifacts live for a week); a version
# that did get published is permanent, so a re-run may need the finished crates or packages skipped by hand.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the tag and the GitHub release (main only); off = build only"
        type: boolean
        default: false

# Deliberately NOT cancelled by a newer run (unlike ci.yml and bench-report.yml): a release cancelled
# between creating the tag and publishing the release would leave a tag with no release. A second run
# waits in the queue instead.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  info:
    name: Read RELEASE.md
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.info.outputs.tag }}
      prerelease: ${{ steps.info.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check RELEASE.md against Cargo.toml
        id: info
        run: bash scripts/release-info.sh | tee -a "$GITHUB_OUTPUT"
        shell: bash

      # The notices travel in every archive and npm package; a changed lock file means they may be stale.
      - name: Check THIRD_PARTY_LICENSES.md against the lock files
        run: node scripts/third-party-licenses.mjs --check
        shell: bash

      - name: Refuse to publish from another branch or over an existing tag
        if: inputs.publish
        env:
          TAG: ${{ steps.info.outputs.tag }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "publishing is only allowed from main (this is $GITHUB_REF)" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "tag $TAG already exists" >&2
            exit 1
          fi

  # Studio's bundle is built once (Linux) and shared with every build job: it is git-ignored, so without it
  # the binaries would silently serve the status page at /__kaanal/studio. Same Vite+ pin as ci.yml's ui job.
  # No dependency cache on purpose (nothing restored from a cache may end up in a release).
  ui:
    name: Build the Studio UI
    needs: info
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: "1.4.0"
          node-version: "26"
          run-install: false

      - name: Install dependencies
        working-directory: ui
        run: vp install

      - name: Check, test and build
        working-directory: ui
        run: |
          vp check
          vp test run
          vp build
          node scripts/postbuild.mjs
          node scripts/size.mjs

      - name: Keep the bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-ui-dist
          path: crates/kaanal-server/ui-dist
          if-no-files-found: error
          # ui-dist/.vite/manifest.json is in a hidden folder; without this the artifact drops it
          include-hidden-files: true
          # a failed crates.io job is re-run from the Actions page and needs the bundle again
          retention-days: 7

  build:
    name: Build (${{ matrix.target }})
    needs: [info, ui]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: zip }
    env:
      TAG: ${{ needs.info.outputs.tag }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the Studio bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: studio-ui-dist
          path: crates/kaanal-server/ui-dist

      # A release must never ship the fallback status page: fail before cargo if any bundle file is missing.
      - name: Require the Studio bundle
        run: |
          for f in index.html .vite/manifest.json; do
            [ -s "crates/kaanal-server/ui-dist/$f" ] || { echo "missing crates/kaanal-server/ui-dist/$f: the release would not contain Studio" >&2; exit 1; }
          done
        shell: bash

      # rustup ships on every runner, so no third-party action is needed. There is no build cache on
      # purpose: nothing restored from a cache may end up in a release binary.
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --target "$TARGET" && rustup default stable
        shell: bash

      # Cargo.toml has no [profile.release], so this is the default release build: not stripped, no LTO, no
      # size tuning. A tuning pass is a separate job that needs measuring (see docs/source/how-to.md).
      - name: Build
        run: cargo build --release --locked -p kaanal --target "$TARGET"
        shell: bash

      - name: Check the binary runs
        run: |
          bin=target/$TARGET/release/kaanal
          [ -f "$bin.exe" ] && bin=$bin.exe
          "$bin" --version
        shell: bash

      - name: Package
        run: |
          name=kaanal-$TAG-$TARGET
          mkdir "$name"
          bin=target/$TARGET/release/kaanal
          [ -f "$bin.exe" ] && bin=$bin.exe
          cp "$bin" LICENSE THIRD_PARTY_LICENSES.md README.md "$name"/
          if [ "${{ matrix.ext }}" = zip ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          file=$name.${{ matrix.ext }}
          if command -v sha256sum > /dev/null; then sha256sum "$file" > "$file.sha256"; else shasum -a 256 "$file" > "$file.sha256"; fi
          cat "$file.sha256"
        shell: bash

      - name: Keep the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kaanal-${{ matrix.target }}
          path: |
            kaanal-${{ needs.info.outputs.tag }}-${{ matrix.target }}.${{ matrix.ext }}
            kaanal-${{ needs.info.outputs.tag }}-${{ matrix.target }}.${{ matrix.ext }}.sha256
          retention-days: 7

  publish:
    name: Tag and publish
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: [info, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.info.outputs.tag }}
      PRERELEASE: ${{ needs.info.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kaanal-*
          merge-multiple: true
          path: dist

      - name: Create the release
        run: |
          bash scripts/release-info.sh --notes notes.md > /dev/null
          (cd dist && cat ./*.sha256 > SHA256SUMS && rm ./*.sha256)
          flags=
          [ "$PRERELEASE" = true ] && flags=--prerelease
          gh release create "$TAG" dist/* $flags --target "$GITHUB_SHA" --title "Kaanal $TAG" --notes-file notes.md

  # crates.io: the six crates in dependency order (cargo waits for the index between them). Studio's bundle
  # is git-ignored but `kaanal-server` packages it (its `include` list), so it is fetched and checked first:
  # a crate published without it would give `cargo install kaanal` the status page instead of Studio.
  crates:
    name: Publish to crates.io
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: [info, ui, publish]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the Studio bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: studio-ui-dist
          path: crates/kaanal-server/ui-dist

      - name: Require the Studio bundle
        run: |
          for f in index.html .vite/manifest.json; do
            [ -s "crates/kaanal-server/ui-dist/$f" ] || { echo "missing crates/kaanal-server/ui-dist/$f: the crate would not contain Studio" >&2; exit 1; }
          done
        shell: bash

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
        shell: bash

      # Trades this run's GitHub identity for a crates.io token that lives for the run (about 30 minutes).
      - name: Get a crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      # --allow-dirty: the checkout is clean, but crates/kaanal-server/ui-dist (the Studio bundle built above) is
      # git-ignored and listed in that crate's `include`, and cargo counts such files as uncommitted.
      - name: Publish
        run: cargo publish --workspace --locked --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # npm: one package per platform with the binary from the archive built above, then the `kaanal` wrapper
  # (scripts/npm-pack.mjs). The platform packages go first so the wrapper never points at a missing version.
  npm:
    name: Publish to npm
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: [info, build, publish]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.info.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kaanal-*
          merge-multiple: true
          path: dist

      # Staged publishing (`npm stage publish`) needs npm 11.15.0 or newer; Node 24 may ship an older one.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Update npm
        run: npm install -g npm@11.15.0
        shell: bash

      - name: Check the packaging script
        run: node --test scripts/npm-pack.test.mjs
        shell: bash

      - name: Build the packages
        run: |
          node scripts/npm-pack.mjs --tag "$TAG" --archives dist --out npm-out
          npm --version
          [ "$(printf '11.15.0\n%s\n' "$(npm --version)" | sort -V | head -n1)" = 11.15.0 ] || { echo "npm is too old for staged publishing" >&2; exit 1; }
        shell: bash

      # No NODE_AUTH_TOKEN anywhere: npm exchanges the run's OIDC token (id-token: write) by itself, and
      # adds the provenance statement.
      # Staged: the versions wait on npm until you approve them (`npm stage approve`, or the Staged Packages
      # tab). Approve the three @kaanal/* packages first, then kaanal.
      - name: Publish (staged)
        run: |
          for d in linux-x64 darwin-arm64 win32-x64 kaanal; do
            (cd "npm-out/$d" && npm stage publish --access public)
          done
        shell: bash
