name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# One run per branch or pull request: a newer push cancels the older run, so only the latest commit is
# tested. Pushes to main are never cancelled (the benchmark baseline comes from main's push runs).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint & Format (fmt, clippy, dprint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Run cargo fmt check
        run: cargo fmt --all --check

      - name: Run cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Rule R3.8: no source file over 800 lines, no test file over 1000 (allowlist in scripts/file-size-allow.txt).
      - name: Check file sizes
        run: bash scripts/check-file-size.sh

      - name: Run dprint markdown check
        uses: dprint/check@v2.5

  test:
    name: Tests (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Run cargo test
        run: cargo test --workspace

  msrv:
    name: MSRV (Rust 1.99)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99

      - uses: Swatinem/rust-cache@v2

      # Keep in sync with `rust-version` in Cargo.toml.
      - name: Build and test on the minimum supported Rust
        run: cargo test --workspace

  # Report-only: it never fails on a regression (shared runners are noisy). The suite's one hard check
  # is NFR-05 (1M simulated requests under 10 s). Pushes to main store their result as the baseline that
  # later runs compare against; scripts/bench.sh runs the same thing locally.
  bench:
    name: Benchmarks (report only)
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: bench

      # Only runs this workflow made for pushes to main are trusted: a branch or pull request run could
      # otherwise leave an artifact of the same name behind.
      - name: Fetch the baseline from the last push to main
        continue-on-error: true
        run: |
          mkdir -p target/bench
          for id in $(gh run list --workflow ci.yml --branch main --event push --limit 10 \
              --json databaseId --jq '.[].databaseId' --repo "$GITHUB_REPOSITORY"); do
            if gh run download "$id" --name bench-baseline --dir target/bench/download --repo "$GITHUB_REPOSITORY"; then
              mv target/bench/download/bench.json target/bench/baseline.json
              echo "baseline from run $id"
              break
            fi
          done

      - name: Run the benchmarks
        run: bash scripts/bench.sh --runs 3 --out bench.json

      - name: Summary
        run: |
          {
            echo "## Benchmarks (3 runs, median of medians)"
            echo
            if [ -f target/bench/baseline.json ]; then
              node scripts/bench-report.mjs compare target/bench/baseline.json bench.json
            else
              echo "No baseline yet: the first push to main creates it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep this run
        uses: actions/upload-artifact@v4
        with:
          name: bench-run
          path: bench.json

      - name: Keep it as the baseline (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: bench-baseline
          path: bench.json

  # Studio's frontend (ui/). Vite+ is pinned to the version in ui/package.json (1.4.0); setup-vp is the
  # documented CI install method (https://viteplus.dev/guide/ci). The bundle is a build artifact, never
  # committed: the Rust jobs above build without it (/__kaanal/studio then serves the status page).
  ui:
    name: UI (vp check, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          version: "1.4.0"
          node-version: "26"
          working-directory: ui
          cache: true

      - name: Check (format, lint, types)
        working-directory: ui
        run: vp check

      - name: Test
        working-directory: ui
        run: vp test run

      # Writes app.js, app.css and index.html into crates/kaanal-server/ui-dist.
      - name: Build
        working-directory: ui
        run: vp build

      - name: Keep the bundle
        uses: actions/upload-artifact@v4
        with:
          name: studio-ui-dist
          path: crates/kaanal-server/ui-dist
          if-no-files-found: error
