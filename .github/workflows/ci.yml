name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Read-only token for every job; the bench job below widens it for itself.
permissions:
  contents: read

# One run per branch or pull request: a newer push cancels the older run, so only the latest commit is
# tested. That includes main: the benchmark baseline is the newest of main's last ten push runs that
# left one (see the bench job), so a cancelled run only means the next push becomes the baseline.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format (fmt, clippy, dprint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run cargo fmt check
        run: cargo fmt --all --check

      - name: Run cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Rule R3.8: no source file over 800 lines, no test file over 1000 (allowlist in scripts/file-size-allow.txt).
      - name: Check file sizes
        run: bash scripts/check-file-size.sh

      - name: Run dprint markdown check
        uses: dprint/check@7dc032d8874778fc024f6f9b4a7e6d896782c330 # v2.5

  test:
    name: Tests (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run cargo test
        run: cargo test --workspace

  msrv:
    name: MSRV (Rust 1.100)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Keep in sync with `rust-version` in Cargo.toml.
      - name: Build and test on the minimum supported Rust
        run: cargo test --workspace

  # Report-only: it never fails on a regression (shared runners are noisy). The suite's one hard check
  # is NFR-05 (1M simulated requests under 10 s). Pushes to main store their result as the baseline that
  # later runs compare against; scripts/bench.sh runs the same thing locally.
  bench:
    name: Benchmarks (report only)
    needs: lint
    runs-on: ubuntu-latest
    # the suite runs three times (the core, simulator, data, server and wire rows: every row of
    # crates/kaanal/tests/bench.rs is reported, a new row needs no change here); a hang must not hold
    # the runner for the default six hours
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: bench

      # Only runs this workflow made for pushes to main are trusted: a branch or pull request run could
      # otherwise leave an artifact of the same name behind.
      - name: Fetch the baseline from the last push to main
        continue-on-error: true
        run: |
          mkdir -p target/bench
          for id in $(gh run list --workflow ci.yml --branch main --event push --limit 10 \
              --json databaseId --jq '.[].databaseId' --repo "$GITHUB_REPOSITORY"); do
            if gh run download "$id" --name bench-baseline --dir target/bench/download --repo "$GITHUB_REPOSITORY"; then
              mv target/bench/download/bench.json target/bench/baseline.json
              echo "baseline from run $id"
              break
            fi
          done

      - name: Run the benchmarks
        run: bash scripts/bench.sh --runs 3 --out bench.json

      - name: Summary
        run: |
          {
            echo "## Benchmarks (3 runs, median of medians)"
            echo
            if [ -f target/bench/baseline.json ]; then
              node scripts/bench-report.mjs compare target/bench/baseline.json bench.json
            else
              echo "No baseline yet: the first push to main creates it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-run
          path: bench.json

      - name: Keep it as the baseline (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-baseline
          path: bench.json

  # Studio's frontend (ui/). Vite+ is pinned to the version in ui/package.json (1.4.0); setup-vp is the
  # documented CI install method (https://viteplus.dev/guide/ci). The bundle is a build artifact, never
  # committed: the Rust jobs above build without it (/__kaanal/studio then serves the status page).
  ui:
    name: UI (vp check, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: "1.4.0"
          node-version: "26"
          working-directory: ui
          cache: true

      - name: Check (format, lint, types)
        working-directory: ui
        run: vp check

      - name: Test
        working-directory: ui
        run: vp test run

      # Writes index.html, assets/ (hashed, code-split) and .vite/manifest.json into crates/kaanal-server/ui-dist.
      - name: Build
        working-directory: ui
        run: vp build

      # Precompresses the assets (.br, .gz) and restores ui-dist/.gitkeep.
      - name: Precompress
        working-directory: ui
        run: node scripts/postbuild.mjs

      # First-load budget (spec 11); fails over it.
      - name: Size budget
        working-directory: ui
        run: node scripts/size.mjs

      - name: Keep the bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-ui-dist
          path: crates/kaanal-server/ui-dist
          if-no-files-found: error
          # the Vite manifest lives in ui-dist/.vite/ (a hidden folder): without this the artifact drops it
          # and the binary would be built without Studio
          include-hidden-files: true
