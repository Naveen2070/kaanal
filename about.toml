# cargo-about: the licence texts of the Rust crates inside the kaanal binary (scripts/third-party-licenses.mjs
# runs it). Add a licence to `accepted` only after reading it; anything else fails the run, which is the point.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]
# The three archives release.yml builds; a crate only one of them uses (windows-sys) is still listed.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
# Test and build tooling is not shipped.
ignore-dev-dependencies = true
ignore-build-dependencies = true
