# separately; real city names with their state abbreviation; CEPs of the right shape
# (00000-000). `{n}` in phone formats and postcodes is n seeded digits. Brazil has no reserved
# fiction range for phone numbers, so the numbers have the plausible shape (area code, mobile
# 9 and eight digits, or a landline) and could belong to a real subscriber: test data only,
# never call or text them.
