[package]
name = "kaanal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Kaanal: a mirage of your backend. Mock APIs, chaos, and what-if simulation in one binary."
homepage = "https://kaanal.naveenr.in"

[dependencies]
kaanal-core.workspace = true
kaanal-server.workspace = true
tokio.workspace = true
clap.workspace = true
clap_complete.workspace = true
humantime.workspace = true
percent-encoding.workspace = true
ureq.workspace = true
serde_json.workspace = true
dirs.workspace = true
sha2.workspace = true
# `init URL` checks the download is OpenAPI 3.0 before saving it.
kaanal-data.workspace = true
url.workspace = true

# The benchmark suite (tests/bench.rs) drives every crate.
[dev-dependencies]
kaanal-sim.workspace = true

[features]
default = ["https"]
# TLS for `kaanal init https://...`: ureq's rustls with the ring provider and the webpki roots.
# Without it, an https URL is a usage error.
https = ["ureq/rustls"]

[target.'cfg(windows)'.dependencies]
kaanal-winhandle.workspace = true

[lints]
workspace = true
