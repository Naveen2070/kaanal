[package]
name = "kaanal-winhandle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Kaanal: the one unsafe call (SetHandleInformation) that keeps `up -d` daemons off the caller's pipes"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_System_Console"] }

# RULES R1.46: the only crate allowed `unsafe`. Everything else matches [workspace.lints]
# (copied, because a crate cannot both inherit the workspace table and override one lint).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
